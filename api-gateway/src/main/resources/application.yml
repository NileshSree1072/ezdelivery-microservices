server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      # Token bucket per client IP, stored in Redis so every gateway instance shares the same counts.
      # replenishRate = tokens added per second, burstCapacity = bucket size (short bursts allowed).
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@clientIpKeyResolver}"
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_PER_SECOND:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**, /api/products
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**, /api/orders
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**

        # Each service's OpenAPI spec, exposed through the gateway for the combined Swagger UI.
        - id: product-docs
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/products
          filters:
            - SetPath=/v3/api-docs
        - id: inventory-docs
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/inventory
          filters:
            - SetPath=/v3/api-docs
        - id: order-docs
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/orders
          filters:
            - SetPath=/v3/api-docs
        - id: payment-docs
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/payments
          filters:
            - SetPath=/v3/api-docs

# One Swagger UI at http://localhost:8080/swagger-ui.html with a dropdown per service.
springdoc:
  swagger-ui:
    urls-primary-name: Orders
    urls:
      - name: Orders
        url: /v3/api-docs/orders
      - name: Products
        url: /v3/api-docs/products
      - name: Inventory
        url: /v3/api-docs/inventory
      - name: Payments
        url: /v3/api-docs/payments

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

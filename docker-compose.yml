name: ezdelivery

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 512m

x-java-env: &java-env
  JAVA_OPTS: "-Xms64m -Xmx256m"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezdelivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezdelivery}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ezdelivery}"]
      interval: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  # ---------- Services ----------
  api-gateway:
    <<: *java-service
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      <<: *java-env
      # Re-resolve service hostnames every 5s so a redeployed service's new IP is picked up.
      JAVA_OPTS: "-Xms64m -Xmx256m -Dsun.net.inetaddr.ttl=5"
      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      SPRING_DATA_REDIS_HOST: redis
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
    depends_on:
      redis: {condition: service_healthy}
      product-service: {condition: service_started}
      inventory-service: {condition: service_started}
      order-service: {condition: service_started}
      payment-service: {condition: service_started}

  product-service:
    <<: *java-service
    build: ./product-service
    ports: ["8081:8081"]
    environment:
      <<: *java-env
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/ezdelivery
      SPRING_DATA_REDIS_HOST: redis
      # Set PRODUCT_CACHE_TYPE=none to switch the cache off (useful for benchmarks).
      SPRING_CACHE_TYPE: ${PRODUCT_CACHE_TYPE:-redis}
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}

  inventory-service:
    <<: *java-service
    build: ./inventory-service
    ports: ["8082:8082"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ezdelivery}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ezdelivery}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  order-service:
    <<: *java-service
    build: ./order-service
    ports: ["8083:8083"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ezdelivery}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ezdelivery}
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      product-service: {condition: service_started}

  payment-service:
    <<: *java-service
    build: ./payment-service
    ports: ["8084:8084"]
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ezdelivery}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ezdelivery}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  notification-service:
    <<: *java-service
    build: ./notification-service
    ports: ["8085:8085"]
    environment:
      <<: *java-env
    depends_on:
      kafka: {condition: service_healthy}

volumes:
  postgres-data:
  mongo-data:

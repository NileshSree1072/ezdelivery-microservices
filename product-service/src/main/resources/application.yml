server:
  port: 8081

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/ezdelivery
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

cache:
  ttl:
    product: ${CACHE_TTL_PRODUCT:10m}
    product-list: ${CACHE_TTL_PRODUCT_LIST:2m}
